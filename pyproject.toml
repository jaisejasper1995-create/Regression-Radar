
[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regression-radar"
version = "0.1.0"
description = "Deterministic JUnit XML regression analysis."
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7.1,<1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1"
]

[project.scripts]
regression-radar = "regression_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
